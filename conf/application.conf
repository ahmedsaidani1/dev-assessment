play.http.secret.key = "changeme"
play.i18n.langs = ["en"]

# Database configuration
db.default.driver = org.h2.Driver
db.default.url = "jdbc:h2:mem:play;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
db.default.username = sa
db.default.password = ""

# Enable H2 Console (development only)
# Access at: http://localhost:8082
h2.console.enabled = true

# JPA configuration
jpa.default = defaultPersistenceUnit

# CORS configuration
play.filters.enabled += "play.filters.cors.CORSFilter"
play.filters.cors {
  pathPrefixes = ["/"]
  allowedOrigins = null
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allowedHttpHeaders = null
}

# CSRF configuration - bypass for API endpoints
play.filters.csrf.header.bypassHeaders {
  X-Requested-With = "*"
  Csrf-Token = "nocheck"
}
play.filters.csrf.contentType.blackList = ["application/json"]

# Database execution context
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = 10
  }
}
