@()
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management - Hybrid Migration</title>
    <link rel="stylesheet" href="@routes.Assets.versioned("stylesheets/main.css")">
</head>
<body>
    <div id="app">
        <header>
            <div class="container">
                <h1>Task Management System</h1>
                <p class="subtitle">Hybrid Migration: Backbone.js → React</p>
            </div>
        </header>
        
        <main class="container">
            <!-- Task Creation Form (Backbone - Legacy) -->
            <section id="task-form-section">
                <h2>Create New Task <span class="tech-badge backbone">Backbone.js</span></h2>
                <form id="task-form">
                    <div class="form-group">
                        <label for="task-title">Title *</label>
                        <input type="text" id="task-title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="task-description">Description</label>
                        <textarea id="task-description" name="description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="task-status">Status</label>
                        <select id="task-status" name="status">
                            <option value="TODO">To Do</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="DONE">Done</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Task</button>
                </form>
            </section>
            
            <!-- Task List (React - Modern) -->
            <section id="task-list-section">
                <h2>Tasks <span class="tech-badge react">React</span></h2>
                <!-- React will mount here -->
                <div id="react-task-list"></div>
                
                <!-- Fallback for no React (will be hidden) -->
                <div id="backbone-task-list" style="display: none;"></div>
            </section>
            
            <!-- Migration Info Box -->
            <section style="background: #f8f9fa; border: 1px solid #dee2e6; padding: 1rem;">
                <h3 style="margin: 0 0 0.5rem 0; color: #495057; font-size: 1rem; font-weight: 500;">Migration Architecture</h3>
                <p style="margin: 0; font-size: 0.85rem; color: #6c757d;">
                    Form (Backbone.js) • Task List (React) • Bridge Pattern for State Sync
                </p>
            </section>
        </main>
    </div>
    
    <!-- Dependencies -->
    <!-- Backbone Dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.13.6/underscore-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.4.1/backbone-min.js"></script>
    
    <!-- React Dependencies -->
    <script crossorigin src="https://unpkg.com/react@@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@@18/umd/react-dom.development.js"></script>
    
    <!-- Backbone Application (Legacy) -->
    <script src="@routes.Assets.versioned("javascripts/app.js")"></script>
    
    <!-- React Components (Modern) - Pre-compiled for faster loading -->
    <script src="@routes.Assets.versioned("javascripts/react-task-list-compiled.js")"></script>
    
    <!-- Bridge between Backbone and React -->
    <script src="@routes.Assets.versioned("javascripts/backbone-react-bridge.js")"></script>
</body>
</html>
