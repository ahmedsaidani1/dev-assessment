@()
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management - Legacy Application</title>
    <link rel="stylesheet" href="@routes.Assets.versioned("stylesheets/main.css")">
</head>
<body>
    <div id="app">
        <header>
            <h1>Task Management System</h1>
            <p class="subtitle">Legacy Architecture: Play Framework + Backbone.js</p>
        </header>
        
        <main class="container">
            <!-- Task Creation Form -->
            <section id="task-form-section">
                <h2>Create New Task</h2>
                <form id="task-form">
                    <div class="form-group">
                        <label for="task-title">Title *</label>
                        <input type="text" id="task-title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="task-description">Description</label>
                        <textarea id="task-description" name="description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="task-status">Status</label>
                        <select id="task-status" name="status">
                            <option value="TODO">To Do</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="DONE">Done</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Task</button>
                </form>
            </section>
            
            <!-- Task List -->
            <section id="task-list-section">
                <h2>Tasks</h2>
                <div id="task-list"></div>
            </section>
        </main>
    </div>
    
    <!-- Task Item Template -->
    <script type="text/template" id="task-template">
        <div class="task-item" data-id="<%= id %>">
            <div class="task-header">
                <h3 class="task-title"><%= title %></h3>
                <span class="task-status status-<%= status.toLowerCase() %>"><%= status.replace('_', ' ') %></span>
            </div>
            <% if (description) { %>
                <p class="task-description"><%= description %></p>
            <% } %>
            <div class="task-actions">
                <select class="status-select" data-id="<%= id %>">
                    <option value="TODO" <%= status === 'TODO' ? 'selected' : '' %>>To Do</option>
                    <option value="IN_PROGRESS" <%= status === 'IN_PROGRESS' ? 'selected' : '' %>>In Progress</option>
                    <option value="DONE" <%= status === 'DONE' ? 'selected' : '' %>>Done</option>
                </select>
                <button class="btn btn-danger btn-delete" data-id="<%= id %>">Delete</button>
            </div>
            <div class="task-meta">
                <small>Created: <%= new Date(createdAt).toLocaleString() %></small>
            </div>
        </div>
    </script>
    
    <!-- Dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.13.6/underscore-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.4.1/backbone-min.js"></script>
    
    <!-- Backbone Application -->
    <script src="@routes.Assets.versioned("javascripts/app.js")"></script>
</body>
</html>
